name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Push to Hugging Face Hub
        uses: huggingface/huggingface-cli-action@v0.1
        with:
          repo-token: ${{ secrets.HF_TOKEN }}
